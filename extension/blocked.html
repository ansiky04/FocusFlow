<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay Focused | FocusFlow Shield</title>
  <link rel="stylesheet" href="blocked.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="container">
    <div class="card">
      <div class="glow"></div>
      <div class="icon-wrapper">
        <span class="rocket-icon">🚀</span>
      </div>

      <h1>Stay Focused</h1>
      <div class="status-badge">Focus Session Active</div>

      <p class="description">
        This website is blocked because your Focus Session is active.
      </p>

      <div class="target-site-card">
        <span class="target-label">Blocked Website</span>
        <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px;">
          <img id="blocked-favicon" src="" alt=""
            style="width: 18px; height: 18px; border-radius: 4px; display: none;" />
          <span id="blocked-domain" class="target-domain">domain.com</span>
        </div>
      </div>

      <!-- Countdown clock -->
      <div class="timer-wrapper">
        <div class="timer-label">Remaining Focus Time</div>
        <div id="countdown" class="timer-digits">00:00</div>
      </div>

      <div class="action-buttons">
        <button id="back-btn" class="btn-primary">Return to FocusFlow</button>
        <button id="close-btn" class="btn-secondary">Close Tab</button>
      </div>
    </div>
  </div>

  <script src="blocked.js"></script>
</body>

</html>
